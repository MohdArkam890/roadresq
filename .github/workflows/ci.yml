# EXPERIMENT 9 — CI: on every push / PR, lint + test + build both apps,
# run the Postman (Newman) API suite against a real API + MongoDB, and
# smoke-test the Docker Compose stack end to end.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roadresq-backend
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGOMS_DISABLE_POSTINSTALL: "1"   # tests use the service container, not a downloaded mongod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: roadresq-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit + integration tests (real MongoDB)
        run: npm run test:coverage
        env:
          JWT_SECRET: ci_test_secret
          NODE_ENV: test
          MONGO_URI_TEST: mongodb://localhost:27017/roadresq_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: roadresq-backend/coverage
          if-no-files-found: ignore

  frontend:
    name: Frontend · lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roadresq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: roadresq/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: /api
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: roadresq/dist

  api-tests:
    name: API · Postman collection (Newman)
    runs-on: ubuntu-latest
    needs: backend
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: roadresq-backend
    env:
      MONGO_URI: mongodb://localhost:27017/roadresq_ci
      JWT_SECRET: ci_api_secret_not_for_production
      PORT: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: roadresq-backend/package-lock.json
      - run: npm ci
      - name: Seed demo data
        run: npm run seed
      - name: Start the API
        run: |
          node server.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/health && exit 0
            sleep 1
          done
          echo "API did not become healthy"; cat api.log; exit 1
      - name: Run the Postman collection
        run: npx newman run postman/RoadResQ.postman_collection.json -e postman/RoadResQ.postman_environment.json --reporters cli,junit --reporter-junit-export newman-results.xml
      - name: Show API log on failure
        if: failure()
        run: cat api.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-results
          path: roadresq-backend/newman-results.xml
          if-no-files-found: ignore

  docker:
    name: Docker · build + compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      JWT_SECRET: ci_docker_secret_not_for_production
    steps:
      - uses: actions/checkout@v4
      - name: Build images and start the stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Frontend is served
        run: curl -sf http://localhost:8080/ | grep -q '<div id="root">'
      - name: SPA fallback works for client-side routes
        run: curl -sf http://localhost:8080/dashboard | grep -q '<div id="root">'
      - name: API reachable directly and through the Nginx proxy
        run: |
          curl -sf http://localhost:5000/api/health | grep -q '"db":"connected"'
          curl -sf http://localhost:8080/api/health | grep -q '"status":"ok"'
      - name: Seed + log in through the proxy
        run: |
          docker compose run --rm seed
          curl -sf -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"customer@roadresq.dev","password":"Password@123"}' | grep -q '"token"'
      - name: WebSocket handshake works through the proxy
        run: curl -sf "http://localhost:8080/socket.io/?EIO=4&transport=polling" | grep -q '"sid"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
