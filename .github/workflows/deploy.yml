# EXPERIMENT 9 — CD: runs only after CI succeeded on main.
#
#   1. publishes both Docker images to GitHub Container Registry (GHCR)
#   2. deploys the backend to Render (deploy hook)
#   3. deploys the frontend to Vercel
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   RENDER_DEPLOY_HOOK_URL   Render service → Settings → Deploy Hook
#   VERCEL_TOKEN             Vercel → Account Settings → Tokens
#   VERCEL_ORG_ID            from `vercel link` (.vercel/project.json)
#   VERCEL_PROJECT_ID        from `vercel link` (.vercel/project.json)
# Optional repo variable:
#   API_HEALTH_URL           e.g. https://roadresq-api.onrender.com/api/health (post-deploy check)
#
# Vercel needs VITE_API_URL (e.g. https://roadresq-api.onrender.com/api) set in the
# project's Environment Variables, and Render needs CORS_ORIGIN = the Vercel URL.
# A job whose secrets are missing is skipped with a notice instead of failing.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Publish Docker images (GHCR)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: roadresq-backend
          - name: frontend
            context: roadresq
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy-backend:
    name: Deploy backend → Render
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: publish-images
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set — skipping backend deploy"; exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Wait for the API to report healthy
        if: ${{ vars.API_HEALTH_URL != '' }}
        run: |
          for i in $(seq 1 30); do
            curl -sf "${{ vars.API_HEALTH_URL }}" && exit 0
            echo "waiting for deploy… ($i/30)"; sleep 10
          done
          echo "API did not become healthy after deploy"; exit 1

  deploy-frontend:
    name: Deploy frontend → Vercel
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: publish-images
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Skip when Vercel secrets are missing
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "::notice::VERCEL_TOKEN is not set — skipping frontend deploy"
      - uses: amondnet/vercel-action@v25
        if: ${{ env.VERCEL_TOKEN != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: roadresq
          vercel-args: "--prod"
